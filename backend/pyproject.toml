[project]
name = "time-reporting-backend"
version = "0.1.0"
description = "Time tracking and billing HTTP API"
authors = [{ name = "Roman Stepanov", email = "rstepanovs@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyjwt>=2.14",
    "pwdlib[argon2]>=0.3.1",
    "email-validator>=2.3",
    "python-multipart>=0.0.32",
    "holidays>=0.104",
    "faktura-printer @ git+https://github.com/rstepanovs/faktura-printer@v0.3.0",
    "jinja2>=3.1.6",
    "weasyprint>=70.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
time-reporting = "time_reporting.cli:main"

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/time_reporting"]

[tool.hatch.metadata]
# faktura-printer is pinned to a tag straight from GitHub (not on an index yet) — see the
# `dependencies` entry above.
allow-direct-references = true
