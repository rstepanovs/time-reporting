[project]
name = "time-reporting-backend"
version = "0.1.0"
description = "Time tracking and billing HTTP API"
authors = [{ name = "Roman Stepanov", email = "rstepanovs@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/time_reporting"]
